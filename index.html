<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vocab Flashcards</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1>Vocab Flashcards</h1>

        <form id="word-form">
            <label for="german-word">Deutsch</label>
            <input id="german-word" name="german" type="text" required>
            
            <label for="english-word">Englisch</label>
            <input id="english-word" name="english" type="text" required>

            <button type="submit">OK</button>
        </form>

        <section>
            <h2>Gespeicherte Wortpaare</h2>
            <button id="select-button" type="button" aria-pressed="false">Select pairs</button>
            <button id="delete-button" type="button" disabled hidden>Delete selected</button>
            <ul id="word-list"></ul>
        </section>
    </main>
</body>
</html>
