<!DOCTYPE html>
<html lang="en-GB">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dairy Diary</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <main>
        <h1>Dairy Diary</h1>
        <form id="entry-form">
            <div class="form-field">
                <label for="entry-date">Date</label>
                <input type="date" id="entry-date" name="date" lang="en-GB" required>
            </div>
            <div class="form-field">
                <label for="meal">Food/Meal</label>
                <input type="text" id="meal" name="meal" required>
            </div>
            <div class="checkbox-field">
                <input type="checkbox" id="contains-lactose" name="containsLactose">
                <label for="contains-lactose">Contains lactose?</label>
            </div>
            <div class="checkbox-field">
                <input type="checkbox" id="symptoms" name="symptoms">
                <label for="symptoms">Symptoms?</label>
            </div>
            <div class="form-field" id="symptom-details-field" hidden>
                <label for="symptom-details">Symptom details</label>
                <textarea id="symptom-details" name="symptomDetails" rows="3"></textarea>
            </div>
            <button type="submit">Add Entry</button>
        </form>

        <h2>Entries</h2>
        <div class="entries-table-wrapper">
            <table>
                <colgroup>
                    <col class="date-column">
                    <col class="meal-column">
                    <col class="lactose-column">
                    <col class="symptoms-column">
                    <col class="details-column">
                </colgroup>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Food/Meal</th>
                        <th>Contains lactose?</th>
                        <th>Symptoms?</th>
                        <th class="details-column">Symptom details</th>
                    </tr>
                </thead>
                <tbody id="entries-table-body"></tbody>
            </table>
        </div>

        <section class="chart-section" aria-labelledby="chart-title">
            <h2 id="chart-title">Symptoms after lactose-containing meals</h2>
            <p class="chart-subtitle" id="chart-subtitle">Based on 0 lactose-containing meals</p>
            <p class="no-chart-data" id="no-chart-data" hidden>No data available yet</p>
            <div class="bar-chart" id="bar-chart" role="img" aria-label="Lactose meal symptom proportions" hidden>
                <span class="bar-with-symptoms" id="bar-with-symptoms" title="0 meals" aria-hidden="true"></span>
                <span class="bar-without-symptoms" id="bar-without-symptoms" title="0 meals" aria-hidden="true"></span>
            </div>
            <div class="bar-chart-legend" id="bar-chart-legend" hidden>
                <p class="with-symptoms-label"><span class="with-symptoms-key"></span>With symptoms <strong id="with-symptoms-result"></strong></p>
                <p class="without-symptoms-label"><span class="without-symptoms-key"></span>Without symptoms <strong id="without-symptoms-result"></strong></p>
            </div>
        </section>
    </main>
</body>
</html>
